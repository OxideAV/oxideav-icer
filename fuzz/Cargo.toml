[package]
name = "oxideav-icer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# ICER's wire format is a sequence of segment headers, each followed by
# packet headers + arithmetic-coded packet bodies (IPN 42-155 §IV).
# `header::walk_segment` parses one segment's framing without touching
# the entropy stage; `parse_icer_metadata` walks every segment in the
# stream; `parse_icer` runs the full decode (framing + arithmetic +
# inverse wavelet). The `decode_segment` target feeds arbitrary bytes
# through all three decoder entry points and asserts none of them ever
# panics / aborts / OOMs.
#
# The `encode_roundtrip` target (round 199) covers the other half of
# the surface: synthesise a small Gray8 image + an `EncodeOptions`
# value from fuzzer-controlled bytes, drive `encode_icer`, and
# self-roundtrip through the strict + lenient decoders. Asserts the
# advertised byte-budget hard cap is honoured and that the strict
# decoder's geometry matches what was encoded.
[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-icer]
path = ".."
default-features = false

# Prevent this from interfering with the umbrella workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_segment"
path = "fuzz_targets/decode_segment.rs"
test = false
doc = false

[[bin]]
name = "encode_roundtrip"
path = "fuzz_targets/encode_roundtrip.rs"
test = false
doc = false
